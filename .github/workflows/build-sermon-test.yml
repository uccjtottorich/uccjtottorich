name: Build microCMS sermon test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test sermon page
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_SERVICE_ID: ${{ vars.MICROCMS_SERVICE_ID }}

        run: |
          python <<'PY'
          import os
          import json
          import html
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          service_id = os.environ["MICROCMS_SERVICE_ID"]
          api_key = os.environ["MICROCMS_API_KEY"]

          url = (
              f"https://{service_id}.microcms.io/"
              "api/v1/sermons?orders=-sermonDate&limit=100"
          )

          req = urllib.request.Request(
              url,
              headers={"X-MICROCMS-API-KEY": api_key}
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          sermons = data.get("contents", [])

          def esc(value):
              return html.escape(str(value or ""))

          def format_date(value):
              if not value:
                  return ""
              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  return f"{dt.year}年{dt.month}月{dt.day}日"
              except Exception:
                  return value

          cards = []

          for sermon in sermons:
              title = esc(sermon.get("title"))
              date = esc(format_date(sermon.get("sermonDate")))
              scripture = esc(sermon.get("scripture"))
              preacher = esc(sermon.get("preacher"))
              summary = esc(sermon.get("summary"))

              cards.append(f"""
              <article class="sermon-card">
                <div class="sermon-date">{date}</div>
                <h2>{title}</h2>
                <div class="sermon-meta">
                  <span>{scripture}</span>
                  <span>{preacher}</span>
                </div>
                <div class="sermon-summary">{summary}</div>
              </article>
              """)

          sermon_html = "\n".join(cards)

          page = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <meta name="robots" content="noindex, nofollow, noarchive">

            <title>主日礼拝説教 CMSテスト | 鳥取教会</title>

            <style>
              * {{
                box-sizing: border-box;
              }}

              body {{
                margin: 0;
                background: #f7f6f2;
                color: #333;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Hiragino Kaku Gothic ProN",
                  "Yu Gothic",
                  sans-serif;
                line-height: 1.9;
              }}

              .page {{
                width: min(900px, calc(100% - 32px));
                margin: 60px auto;
              }}

              .test-label {{
                display: inline-block;
                margin-bottom: 18px;
                padding: 5px 12px;
                border: 1px solid #aaa;
                border-radius: 999px;
                font-size: 12px;
                letter-spacing: .08em;
              }}

              .page-title {{
                margin: 0 0 10px;
                font-size: clamp(28px, 5vw, 44px);
                font-weight: 500;
              }}

              .lead {{
                margin-bottom: 42px;
                color: #666;
              }}

              .sermon-card {{
                margin: 0 0 28px;
                padding: 32px;
                background: #fff;
                border-radius: 12px;
                box-shadow:
                  0 4px 22px rgba(0,0,0,.05);
              }}

              .sermon-date {{
                color: #777;
                font-size: 14px;
                letter-spacing: .05em;
              }}

              .sermon-card h2 {{
                margin: 8px 0 12px;
                font-size: 25px;
                font-weight: 500;
              }}

              .sermon-meta {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 20px;
                padding-bottom: 18px;
                border-bottom: 1px solid #ddd;
                color: #666;
                font-size: 14px;
              }}

              .sermon-summary {{
                margin-top: 22px;
                white-space: pre-line;
              }}

              @media (max-width: 600px) {{
                .page {{
                  margin-top: 32px;
                }}

                .sermon-card {{
                  padding: 23px;
                }}
              }}
            </style>
          </head>

          <body>
            <main class="page">
              <span class="test-label">CMS TEST</span>

              <h1 class="page-title">主日礼拝説教</h1>

              <p class="lead">
                microCMS連携テストページです。
              </p>

              {sermon_html}
            </main>
          </body>
          </html>
          """

          output = Path("test-cms-2026/sermon.html")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(page, encoding="utf-8")

          print(f"Generated {output}")
          print(f"Sermons: {len(sermons)}")
          PY

      - name: Commit test page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test-cms-2026/sermon.html

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update microCMS sermon test page"
            git push
          fi
